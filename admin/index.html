<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 — 恒星序列</title>
  <style>
    :root {
      --bg: #0a0a14;
      --card: #111122;
      --border: #1e1e3a;
      --text: #e0e0f0;
      --text2: #8888aa;
      --accent: #a882ff;
      --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'SF Pro', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .container { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.5rem; font-weight: 300; letter-spacing: 1px; }
    header a { color: var(--text2); text-decoration: none; font-size: 0.85rem; }
    header a:hover { color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 24px; }
    .card h2 { font-size: 1.1rem; font-weight: 400; margin-bottom: 20px; color: var(--accent); letter-spacing: 0.5px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color 0.3s; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .btn { padding: 10px 24px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.88rem; font-family: inherit; transition: all 0.3s; letter-spacing: 0.3px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #b892ff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 6px 16px; font-size: 0.8rem; }
    .btn-danger { background: #ef4444; color: #fff; }
    .upload-area { border: 1px dashed var(--border); border-radius: var(--radius); padding: 32px; text-align: center; color: var(--text2); cursor: pointer; transition: all 0.3s; }
    .upload-area:hover { border-color: var(--accent); background: rgba(168,130,255,0.04); }
    .upload-area.dragover { border-color: var(--accent); background: rgba(168,130,255,0.08); }
    .preview { margin-top: 16px; }
    .preview img, .preview video { max-width: 100%; max-height: 200px; border-radius: 6px; border: 1px solid var(--border); }
    .media-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 20px; }
    .media-slot { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
    .media-slot h4 { font-size: 0.8rem; color: var(--text2); margin-bottom: 12px; letter-spacing: 0.5px; }
    .media-slot .slot-preview { width: 100%; aspect-ratio: 16/9; background: rgba(255,255,255,0.03); border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; overflow: hidden; }
    .media-slot .slot-preview img, .media-slot .slot-preview video { width: 100%; height: 100%; object-fit: cover; }
    .media-slot .slot-preview.empty { color: var(--text2); font-size: 0.8rem; }
    .toast { position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 12px 24px; border-radius: 8px; color: #fff; font-size: 0.88rem; animation: slideIn 0.3s ease; }
    .toast.success { background: rgba(34,197,94,0.9); }
    .toast.error { background: rgba(239,68,68,0.9); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .tag-item { display: flex; align-items: center; gap: 6px; padding: 4px 12px; background: rgba(168,130,255,0.1); border: 1px solid rgba(168,130,255,0.2); border-radius: 20px; font-size: 0.78rem; }
    .tag-item button { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 0.9rem; line-height: 1; }
    .tag-item button:hover { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>&#10038; 恒星序列 · 管理后台</h1>
      <a href="/">&#8592; 返回官网</a>
    </header>

    <!-- Site Info -->
    <div class="card">
      <h2>站点信息</h2>
      <div class="form-row">
        <div class="form-group">
          <label>中文名称</label>
          <input type="text" id="siteName" placeholder="恒星序列">
        </div>
        <div class="form-group">
          <label>英文名称</label>
          <input type="text" id="siteNameEn" placeholder="Stellar Sequence">
        </div>
      </div>
      <div class="form-group">
        <label>标语</label>
        <input type="text" id="siteTagline" placeholder="创意AI工作室 · 始于2023">
      </div>
      <div class="form-group">
        <label>简介描述</label>
        <textarea id="siteDesc" placeholder="公司简介..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="saveSite()">保存站点信息</button>
    </div>

    <!-- Hero -->
    <div class="card">
      <h2>首页 Hero</h2>
      <div class="form-row">
        <div class="form-group">
          <label>第一行</label>
          <input type="text" id="hero1" placeholder="我们构建">
        </div>
        <div class="form-group">
          <label>高亮词</label>
          <input type="text" id="heroEm" placeholder="智能">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>第二行</label>
          <input type="text" id="hero2" placeholder="创意">
        </div>
        <div class="form-group">
          <label>第三行</label>
          <input type="text" id="hero3" placeholder="生态体系。">
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveHero()">保存 Hero</button>
    </div>

    <!-- Matrix -->
    <div class="card">
      <h2>矩阵区域文字</h2>
      <div class="form-row">
        <div class="form-group">
          <label>标签</label>
          <input type="text" id="matrixLabel" placeholder="星座网络">
        </div>
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="matrixTitle" placeholder="恒星矩阵">
        </div>
      </div>
      <div class="form-group">
        <label>描述</label>
        <textarea id="matrixDesc" placeholder="每个节点代表一项能力..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="saveMatrix()">保存矩阵文字</button>
    </div>

    <!-- Services -->
    <div class="card">
      <h2>五大服务</h2>
      <div id="servicesEditor"></div>
      <button class="btn btn-primary" onclick="saveServices()" style="margin-top: 16px;">保存服务内容</button>
    </div>

    <!-- Stats -->
    <div class="card">
      <h2>数据统计</h2>
      <div id="statsEditor"></div>
      <button class="btn btn-primary" onclick="saveStats()" style="margin-top: 16px;">保存数据统计</button>
    </div>

    <!-- Media Upload -->
    <div class="card">
      <h2>媒体管理</h2>

      <h3 style="font-size: 0.9rem; color: var(--text2); margin-bottom: 12px;">网站图标 (Favicon)</h3>
      <div class="media-slot" style="margin-bottom: 20px;">
        <div class="slot-preview" id="faviconPreview"><span class="empty">未上传</span></div>
        <input type="file" accept="image/*,.ico,.svg" onchange="uploadMedia(this, 'favicon')" style="margin-top: 8px;">
      </div>

      <h3 style="font-size: 0.9rem; color: var(--text2); margin-bottom: 12px;">精选视频</h3>
      <div class="media-slot" style="margin-bottom: 20px;">
        <div class="slot-preview" id="videoPreview"><span class="empty">未上传</span></div>
        <input type="file" accept="video/*" onchange="uploadMedia(this, 'video')" style="margin-top: 8px;">
      </div>

      <h3 style="font-size: 0.9rem; color: var(--text2); margin-bottom: 12px;">展示图片 (4格)</h3>
      <div class="media-grid">
        <div class="media-slot">
          <h4>图片 1</h4>
          <div class="slot-preview" id="imgPreview0"><span class="empty">未上传</span></div>
          <input type="file" accept="image/*" onchange="uploadMedia(this, 'image-0')">
        </div>
        <div class="media-slot">
          <h4>图片 2</h4>
          <div class="slot-preview" id="imgPreview1"><span class="empty">未上传</span></div>
          <input type="file" accept="image/*" onchange="uploadMedia(this, 'image-1')">
        </div>
        <div class="media-slot">
          <h4>图片 3</h4>
          <div class="slot-preview" id="imgPreview2"><span class="empty">未上传</span></div>
          <input type="file" accept="image/*" onchange="uploadMedia(this, 'image-2')">
        </div>
        <div class="media-slot">
          <h4>图片 4</h4>
          <div class="slot-preview" id="imgPreview3"><span class="empty">未上传</span></div>
          <input type="file" accept="image/*" onchange="uploadMedia(this, 'image-3')">
        </div>
      </div>
    </div>

  </div>

  <script>
    const API = '/api/content';
    let contentData = {};

    // Load current content
    async function loadData() {
      try {
        const res = await fetch(API);
        contentData = await res.json();
        populateForm();
      } catch (e) {
        toast('无法加载内容数据', 'error');
      }
    }

    function populateForm() {
      const d = contentData;
      // Site
      if (d.site) {
        setVal('siteName', d.site.name);
        setVal('siteNameEn', d.site.nameEn);
        setVal('siteTagline', d.site.tagline);
        setVal('siteDesc', d.site.description);
      }
      // Hero
      if (d.hero) {
        setVal('hero1', d.hero.title1);
        setVal('heroEm', d.hero.titleEm);
        setVal('hero2', d.hero.title2);
        setVal('hero3', d.hero.title3);
      }
      // Matrix
      if (d.matrix) {
        setVal('matrixLabel', d.matrix.label);
        setVal('matrixTitle', d.matrix.title);
        setVal('matrixDesc', d.matrix.desc);
      }
      // Services
      renderServices(d.services || []);
      // Stats
      renderStats(d.stats || []);
      // Media previews
      if (d.media) {
        if (d.media.video) showPreview('videoPreview', d.media.video, 'video');
        d.media.images.forEach((url, i) => {
          if (url) showPreview('imgPreview' + i, url, 'img');
        });
      }
      if (d.favicon) showPreview('faviconPreview', d.favicon, 'img');
    }

    function setVal(id, val) {
      const el = document.getElementById(id);
      if (el && val !== undefined) el.value = val;
    }

    function showPreview(id, url, type) {
      const el = document.getElementById(id);
      if (!el) return;
      if (type === 'video') {
        el.innerHTML = `<video src="${url}" controls style="width:100%;height:100%;object-fit:cover;"></video>`;
      } else {
        el.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">`;
      }
    }

    // --- Services Editor ---
    function renderServices(services) {
      const container = document.getElementById('servicesEditor');
      container.innerHTML = services.map((s, i) => `
        <div style="border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px;">
          <strong style="font-size: 0.85rem; color: var(--accent);">服务 ${i + 1}</strong>
          <div class="form-row" style="margin-top: 10px;">
            <div class="form-group"><label>标题</label><input type="text" value="${esc(s.title)}" data-sid="${i}" data-field="title"></div>
          </div>
          <div class="form-group"><label>描述</label><textarea data-sid="${i}" data-field="desc">${esc(s.desc)}</textarea></div>
          <div class="form-group">
            <label>标签（逗号分隔）</label>
            <input type="text" value="${(s.tags || []).join(', ')}" data-sid="${i}" data-field="tags">
          </div>
        </div>
      `).join('');
    }

    function collectServices() {
      const container = document.getElementById('servicesEditor');
      const items = container.querySelectorAll('[data-sid]');
      const services = [];
      const map = {};
      items.forEach(el => {
        const idx = parseInt(el.dataset.sid);
        if (!map[idx]) map[idx] = { id: idx + 1, title: '', desc: '', tags: [] };
        if (el.dataset.field === 'title') map[idx].title = el.value;
        if (el.dataset.field === 'desc') map[idx].desc = el.value;
        if (el.dataset.field === 'tags') map[idx].tags = el.value.split(',').map(t => t.trim()).filter(Boolean);
      });
      return Object.values(map);
    }

    // --- Stats Editor ---
    function renderStats(stats) {
      const container = document.getElementById('statsEditor');
      container.innerHTML = stats.map((s, i) => `
        <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 10px;">
          <span style="color: var(--accent); font-size: 0.8rem; width: 24px;">${i + 1}</span>
          <input type="text" value="${esc(s.number)}" data-stid="${i}" data-sfield="number" placeholder="数字" style="flex:1; padding: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.9rem; outline: none;">
          <input type="text" value="${esc(s.label)}" data-stid="${i}" data-sfield="label" placeholder="标签" style="flex:2; padding: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.9rem; outline: none;">
        </div>
      `).join('');
    }

    function collectStats() {
      const items = document.querySelectorAll('[data-stid]');
      const map = {};
      items.forEach(el => {
        const idx = parseInt(el.dataset.stid);
        if (!map[idx]) map[idx] = { number: '', label: '' };
        map[idx][el.dataset.sfield] = el.value;
      });
      return Object.values(map);
    }

    // --- Save Functions ---
    async function saveSite() {
      await update({ site: { name: val('siteName'), nameEn: val('siteNameEn'), tagline: val('siteTagline'), description: val('siteDesc') } });
    }
    async function saveHero() {
      await update({ hero: { title1: val('hero1'), titleEm: val('heroEm'), title2: val('hero2'), title3: val('hero3') } });
    }
    async function saveMatrix() {
      await update({ matrix: { label: val('matrixLabel'), title: val('matrixTitle'), desc: val('matrixDesc') } });
    }
    async function saveServices() {
      await update({ services: collectServices() });
    }
    async function saveStats() {
      await update({ stats: collectStats() });
    }

    async function update(patch) {
      try {
        const res = await fetch(API, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch)
        });
        if (res.ok) { toast('保存成功', 'success'); contentData = (await res.json()).data; }
        else toast('保存失败', 'error');
      } catch (e) { toast('网络错误', 'error'); }
    }

    // --- Upload ---
    async function uploadMedia(input, type) {
      const file = input.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('file', file);
      formData.append('type', type);

      try {
        const res = await fetch('/api/upload/media', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          toast('上传成功', 'success');
          contentData = (await fetch(API).then(r => r.json()));
          populateForm();
        } else {
          toast('上传失败', 'error');
        }
      } catch (e) { toast('上传错误', 'error'); }
    }

    function val(id) { return document.getElementById(id)?.value || ''; }
    function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    function toast(msg, type) {
      const old = document.querySelector('.toast');
      if (old) old.remove();
      const t = document.createElement('div');
      t.className = 'toast ' + type;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    loadData();
  </script>
</body>
</html>
